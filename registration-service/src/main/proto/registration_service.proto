syntax = "proto3";

package com.example.registration.grpc;

option java_multiple_files = true;


service RegistrationService {
  /**
     * Create new registration session for the give set of phone number, mmc, mnc and ratelimiter key
     */
  rpc CreateSession(CreateRegistrationSessionRequest) returns (CreateRegistraionSessionResponse);
}

message CreateRegistrationSessionRequest {
  uint64 e164 = 1;
  string mmc = 2;
  string mnc = 3;
  bool account_exist_with_e164 = 4;
  string rate_limit_collation_key = 5;
}

message CreateRegistraionSessionResponse {
  oneof response {
    RegistraionSessionMetadata session_meta = 1;
    CreateRegistrationSessionError error = 2;
  }
}

message RegistraionSessionMetadata {
  bytes session_id = 1;
  uint64 e164 = 2;
  bool verified = 8;
  bool may_request_sms = 3;
  uint64 next_sms_seconds = 4;
  bool may_code_check = 5;
  uint64 next_code_check_seconds = 6;
  uint64 expiration_seconds = 7;
}

message CreateRegistrationSessionError {
  CreateRegistrationSessionErrorType error_type = 1;
  bool may_retry = 2;
  uint64 retry_after_seconds = 3;
}

enum CreateRegistrationSessionErrorType {
  CREATE_REGISTRATION_SESSION_ERROR_TYPE_UNSPECIFIED = 0;
  CREATE_REGISTRATION_SESSION_ERROR_TYPE_RATE_LIMITED = 1;
  CREATE_REGISTRATION_SESSION_ERROR_TYPE_ILLEGAL_PHONE_NUMBER = 2;
}

enum MessageTransport {
  MESSAGE_TRANSPORT_UNSPECIFIED = 0;
  MESSAGE_TRANSPORT_SMS = 1;
  MESSAGE_TRANSPORT_VOICE = 2;
}