
user nginx;
worker_processes auto;
pid /run/nginx.pid;


events {
    worker_connections 1024;
}

stream{

    upstream relay {
        server ngixn-relay:4433;
    }

    server {
        listen 443 ssl;
        proxy_pass relay;

        access_log /dev/stdout;
        error_log /dev/stderr debug;

        ssl_certificate /usr/certs/fullchain.pem;
        ssl_certificate_key /usr/certs/privkey.pem;
    }
}